<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitMon</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1>GitMon</h1>
    <label class="switch">
      <input type="checkbox" id="enableToggle" />
      <span class="slider"></span>
    </label>
    <span id="statusText">Enabled</span>
    <br/>
    <label class="switch" style="margin-top:8px;">
      <input type="checkbox" id="originalToggle" />
      <span class="slider"></span>
    </label>
    <span id="originalText">Original Colors</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
